[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fihris"
dynamic = ["version"]
description = "A retrieval engine for Arabic and English documents: ingestion, structure-aware chunks, hybrid BM25 and dense search across languages, reranking and access control."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "arabic", "search", "bm25", "embeddings", "reranking",
            "postgresql", "pgvector", "qdrant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pdf-ar>=0.2",
    "textkeel>=0.3",
    "numpy>=1.26",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "transformers>=4.46",
    "sentencepiece>=0.2",
    "huggingface-hub>=0.26",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Qdrant as the vector store (FIHRIS_VECTOR_STORE=qdrant) instead of pgvector, and compare-stores.
qdrant = [
    "qdrant-client>=1.12",
]
# The opus-mt question translator runs locally on torch (CUDA when available).
translate = [
    "torch>=2.4",
]
# OCR fallback for pages the quality gate rejects. Tesseract 5 itself is installed outside pip.
ocr = [
    "pytesseract>=0.3.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/oreaba/fihris"
Repository = "https://github.com/oreaba/fihris"
Issues = "https://github.com/oreaba/fihris/issues"

[project.scripts]
fihris = "fihris.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fihris.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
